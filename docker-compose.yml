version: '3.8'

services:
  # Application Server (Nginx + PHP-FPM + Laravel Queue Worker)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: burnoutxpert-app
    restart: always
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=burnoutxpert
      - DB_USERNAME=burnout_user
      - DB_PASSWORD=burnout_password
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis

  # Production MySQL Database Service
  db:
    image: mysql:8.0
    container_name: burnoutxpert-db
    restart: always
    environment:
      MYSQL_DATABASE: burnoutxpert
      MYSQL_USER: burnout_user
      MYSQL_PASSWORD: burnout_password
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    ports:
      - "33060:3306"
    volumes:
      - dbdata:/var/lib/mysql

  # High-Performance Caching & Session Storage Node
  redis:
    image: redis:alpine
    container_name: burnoutxpert-redis
    restart: always
    ports:
      - "63790:6379"
    volumes:
      - redisdata:/data

volumes:
  dbdata:
  redisdata:
